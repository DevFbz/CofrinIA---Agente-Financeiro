[project]
name = "finance-whatsapp-assistant"
version = "0.1.0"
description = "Assistente financeiro para WhatsApp com FastAPI e LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<1",
  "langgraph>=0.2,<1",
  "langchain-openai>=0.3,<1",
  "faster-whisper>=1.2,<2",
  "pillow>=11,<12",
  "pytesseract>=0.3.13,<1",
  "openpyxl>=3.1,<4",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

target-version = "py311"
